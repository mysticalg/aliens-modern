<!doctype html><html><head><style>body{margin:0;background:#000}canvas{width:100vw;height:100vh;display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body><canvas id="c"></canvas>
<script type="module">
import {THREE,scene,camera,resize,render,loadEnv,flash,hemi,pool} from './js/engine.js';
import {pbr,boxGeo} from './js/assets.js';import {Alien,Hugger,Queen,egg} from './js/creatures.js';
const P=new URLSearchParams(location.search);
await loadEnv();resize();scene.fog.density=.01;
const fl=new THREE.Mesh(boxGeo(30,.1,20,2),pbr('plate'));fl.position.y=-.05;fl.receiveShadow=true;scene.add(fl);
const a=new Alien();a.root.position.set(-1.6,0,0);a.root.rotation.y=+P.get('ry')||.8;scene.add(a.root);
const a2=new Alien();a2.root.position.set(0,0,-1);a2.root.rotation.y=-.6;scene.add(a2.root);
const h=new Hugger();h.root.position.set(1.2,0,1);h.root.rotation.y=-.5;scene.add(h.root);
const q=new Queen();q.root.position.set(3.5,0,-5);q.root.rotation.y=-.5;scene.add(q.root);
const e=egg();e.position.set(1.6,0,0);e.userData.open(.6);scene.add(e);
for(let i=0;i<30;i++){a.update(.033,{speed:0});a2.update(.033,{speed:4});h.update(.033,{speed:2});q.update(.033,{})}
const cz=+P.get('z')||5,cy=+P.get('y')||1.5;camera.position.set(+P.get('x')||0,cy,cz);camera.lookAt(+P.get('lx')||0,+P.get('ly')||1,0);
flash.position.set(1,3,5);flash.target.position.set(0,1,0);flash.intensity=50;hemi.intensity=.6;pool[0].position.set(-3,3,2);pool[0].color.set(0x66aaff);pool[0].intensity=25;
function loop(){requestAnimationFrame(loop);render()}loop();window.ready=1;
</script></body></html>
